# XcodeGen project manifest – iOS 26, Swift 6.2
# Setup:
#   brew install xcodegen
#   cd ios && xcodegen generate
#   open FlowByElysian.xcodeproj

name: FlowByElysian
options:
  bundleIdPrefix: com.flowbyelysian
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "16.3"
  swift: "6.2"

packages:
  # Clerk iOS SDK – replace placeholder key in Config.swift after setup
  ClerkSDK:
    url: https://github.com/clerk/clerk-ios
    from: "2.0.0"

targets:
  FlowByElysian:
    type: application
    platform: iOS
    sources:
      - FlowByElysian
    dependencies:
      - package: ClerkSDK
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowbyelysian.app
        SWIFT_VERSION: 6.2
        DEVELOPMENT_TEAM: ""           # Add your Apple Team ID
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_STRICT_CONCURRENCY: complete
    entitlements:
      path: FlowByElysian/FlowByElysian.entitlements
      properties:
        com.apple.security.network.client: true
    info:
      path: FlowByElysian/Info.plist
      properties:
        CFBundleDisplayName: "Flow by Elysian"
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false

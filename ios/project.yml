# XcodeGen project manifest
# Installera: brew install xcodegen
# Kör sedan: cd ios && xcodegen generate

name: FlowByElysian
options:
  bundleIdPrefix: com.flowbyelysian
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

targets:
  FlowByElysian:
    type: application
    platform: iOS
    sources:
      - FlowByElysian
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowbyelysian.app
        SWIFT_VERSION: 5.9
        DEVELOPMENT_TEAM: ""  # Fyll i ditt Apple Team ID
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    entitlements:
      path: FlowByElysian/FlowByElysian.entitlements
      properties:
        com.apple.security.network.client: true
    info:
      path: FlowByElysian/Info.plist
      properties:
        CFBundleDisplayName: "Flow by Elysian"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        UILaunchScreen: {}

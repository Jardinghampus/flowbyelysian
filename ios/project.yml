# XcodeGen project manifest – iOS 26, Swift 6.2
# Setup:
#   brew install xcodegen
#   cd ios && xcodegen generate
#   open FlowByElysian.xcodeproj

name: FlowByElysian
options:
  bundleIdPrefix: com.flowbyelysian
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "16.3"
  swift: "6.2"

packages:
  ClerkSDK:
    url: https://github.com/clerk/clerk-ios
    branch: "main"

targets:

  # ─── Main App ─────────────────────────────────────────────────────────────
  FlowByElysian:
    type: application
    platform: iOS
    sources:
      - FlowByElysian
    dependencies:
      - package: ClerkSDK
      - target: FlowByElysianWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowbyelysian.app
        SWIFT_VERSION: 6.2
        DEVELOPMENT_TEAM: ""           # Add your Apple Team ID
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_STRICT_CONCURRENCY: complete
    entitlements:
      path: FlowByElysian/FlowByElysian.entitlements
      properties:
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - group.com.flowbyelysian.app
        aps-environment: development   # change to "production" before App Store
    info:
      path: FlowByElysian/Info.plist
      properties:
        CFBundleDisplayName: "Flow by Elysian"
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        NSCalendarsUsageDescription: "Flow läser dina kalenderhändelser för widgeten och kommande visningar."
        NSCalendarsFullAccessUsageDescription: "Flow läser dina kalenderhändelser för widgeten och kommande visningar."
        NSUserNotificationUsageDescription: "Få notiser om nya matchningar, klientförfrågningar och kommande visningar."

  # ─── Widget Extension ─────────────────────────────────────────────────────
  FlowByElysianWidget:
    type: app-extension
    platform: iOS
    sources:
      - FlowByElysianWidget
      - path: FlowByElysian/Core/Shared/WidgetDataStore.swift
        type: file
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowbyelysian.widget
        SWIFT_VERSION: 6.2
        DEVELOPMENT_TEAM: ""           # Must match main app Team ID
        SWIFT_STRICT_CONCURRENCY: complete
    entitlements:
      path: FlowByElysianWidget/FlowByElysianWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.flowbyelysian.app
    info:
      path: FlowByElysianWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
